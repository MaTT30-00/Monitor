<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#BDE2F6">
<meta name="description" content="Scadenze, tagliandi e spese di auto, moto e bici, sempre sotto controllo.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Monitor">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Monitor – scadenze e storico del tuo veicolo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6F3FB;--bg-top:#BDE2F6;--bg-mid:#D8EEFA;--bg-bot:#EEF8FD;--surface:#FFFFFF;--ink:#3E3A45;--muted:#5A5563;--line:#E4E5F0;--stroke:#6B4A3A;--shadow:rgba(60,60,110,.12);--dot:#E4E5F0;
  --pat:rgba(108,94,181,.07);--pat2:rgba(108,94,181,.17);
  --brand:#B85C3E;--brand-ink:#FFFFFF;--brand-soft:#F4E1D6;--link:#A24B30;
  --ok-btn:#5E7D58;--ok-btn-ink:#FFFFFF;
  --hero-bg:linear-gradient(135deg,#F5D7C5,#E8AC8E);--hero-ink:#3E3A45;--hero-muted:#6B5648;--hero-btn:#B85C3E;--hero-btn-ink:#FFFFFF;
  --late-bg:#F7D9D4;--late:#A83A32;--warn-bg:#FBE2CC;--warn:#9A4F1C;--soon-bg:#DCE7F5;--soon:#365B8C;--ok-bg:#DCE8D4;--ok:#3F6340;
  --danger:#A83A32;
  --t-auto:#F5D9CB;--t-moto:#D9E5D2;--t-bici:#F1E6D2;--t-casa:#EFD6D3;--t-ass:#D3E8E3;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:520px;margin:0 auto;padding:12px 16px 120px}
header.top{display:flex;align-items:center;gap:10px;padding:8px 0 4px}
.mark{width:36px;height:36px;border-radius:10px;background:var(--brand);color:var(--brand-ink);display:flex;align-items:center;justify-content:center}
.brand-name{font-weight:800;font-size:17px;letter-spacing:-.2px}
h1{margin:12px 0 4px;font-size:28px;line-height:1.15;font-weight:800;letter-spacing:-.5px}
h2{margin:0;font-size:18px;font-weight:800}
.sub{color:var(--muted);font-size:14px;margin:0 0 4px}
svg{display:block;flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}
.hero{background:var(--hero-bg);color:var(--hero-ink);border-radius:20px;padding:20px;margin-top:14px;display:flex;flex-direction:column;gap:14px}
.hero .big{font-size:32px;font-weight:800;letter-spacing:-.8px;line-height:1.05}
.hero .meta{color:var(--hero-muted);font-size:15px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:24px 0 0}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-top:12px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
.item:first-child{border-top:none}
.item .ico{width:40px;height:40px;border-radius:12px;background:var(--brand-soft);color:var(--link);display:flex;align-items:center;justify-content:center}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:700;font-size:15px}
.item .s{font-size:13px;color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap}
.chip.late{background:var(--late-bg);color:var(--late)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.soon{background:var(--soon-bg);color:var(--soon)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.btn{font-family:inherit;font-weight:700;font-size:15px;min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.hero-btn{background:var(--hero-btn);border-color:var(--hero-btn);color:var(--hero-btn-ink)}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn.small{min-height:44px;padding:0 14px;font-size:14px}
.btn.icon{width:44px;min-height:44px;padding:0}
.btn:focus-visible,.tab:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.actions{display:flex;gap:10px;margin-top:16px}
.actions .btn{flex:1}
.empty{text-align:center;padding:28px 16px}
.empty p{color:var(--muted);margin:8px 0 16px}
.bar-row{display:flex;align-items:center;gap:10px;padding:6px 0}
.bar-row .name{width:120px;flex:none;font-size:14px;font-weight:600}
.bar-row .track{flex:1;height:10px;border-radius:6px;background:var(--brand-soft);overflow:hidden}
.bar-row .fill{height:100%;background:var(--brand);border-radius:6px}
.bar-row .amt{width:84px;flex:none;text-align:right;font-weight:700;font-size:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5}
.tabs-in{display:flex;width:100%;max-width:520px;gap:4px}
.tab{flex:1;min-height:56px;border:none;background:transparent;color:var(--muted);font-family:inherit;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:12px;cursor:pointer}
.tab[aria-current="page"]{color:var(--link);background:var(--brand-soft)}
label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}
input[type=text],input[type=date],select,textarea{width:100%;min-height:48px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-family:inherit;font-size:16px}
textarea{min-height:160px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace}
.check{display:flex;align-items:center;gap:10px;min-height:44px;margin-top:10px;font-weight:600}
.check input{width:22px;height:22px}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.err{color:var(--danger);font-weight:700;font-size:14px;margin-top:10px}
#sheet{position:fixed;inset:0;z-index:20;display:none}
#sheet.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(8,16,22,.55)}
.panel{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--surface);border-radius:20px 20px 0 0;padding:12px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:90%;overflow-y:auto}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:12px 14px;font-weight:600;font-size:14px;margin-top:12px}
.note{font-size:13px;color:var(--muted);margin-top:12px}
.bigbtn{width:100%;display:flex;align-items:center;gap:16px;text-align:left;font-family:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;min-height:132px;margin-top:14px;cursor:pointer}
.bigbtn:active{background:var(--brand-soft)}
.bigbtn:focus-visible,.alertcard:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.illo{flex:none;width:112px;height:92px;border:3px solid #1F2A44;border-radius:18px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.illo svg{width:100%;height:100%}
.avatar{width:140px;height:140px;border-radius:50%;margin:0 auto;border:3px solid #1F2A44;background:var(--brand-soft);color:var(--link);display:flex;align-items:center;justify-content:center;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);opacity:0}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:14px}
.vhead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.vname{font-size:20px;font-weight:800;letter-spacing:-.3px;line-height:1.15}
.dl{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.cd{flex:none;width:68px;height:68px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.cd b{font-size:24px;font-weight:800}.cd span{font-size:12px;margin-top:4px;font-weight:700}
.cd.late{background:var(--late-bg);color:var(--late)}.cd.warn{background:var(--warn-bg);color:var(--warn)}.cd.soon{background:var(--soon-bg);color:var(--soon)}.cd.ok{background:var(--ok-bg);color:var(--ok)}
.kindgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.kindbtn{min-height:88px;border-radius:16px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-family:inherit;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:10px;text-align:center}
.kindbtn:active{background:var(--brand-soft)}
details.more{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:0 14px}
details.more summary{min-height:48px;display:flex;align-items:center;font-weight:700;cursor:pointer}
.btn.big{min-height:56px;font-size:17px;border-radius:14px}
.linkbtn{background:none;border:none;color:var(--link);font-family:inherit;font-weight:700;font-size:14px;min-height:44px;padding:0 4px;cursor:pointer;text-align:left}
a.linkbtn{display:inline-flex;align-items:center;text-decoration:none}
.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:488px;margin:0 auto;background:var(--hero-bg);color:var(--hero-ink);border-radius:14px;padding:6px 8px 6px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;z-index:15;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.docgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}
.docthumb{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:6px;font-family:inherit;color:var(--ink);font-weight:700;font-size:12px;cursor:pointer}
.docthumb img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.mchart{display:flex;align-items:stretch;gap:5px;height:130px}
.mcol{flex:1;display:flex;flex-direction:column;min-width:0}
.mbarwrap{flex:1;display:flex;align-items:flex-end}
.mbar{width:100%;background:var(--brand);border-radius:4px 4px 0 0}
.mlab{font-size:11px;color:var(--muted);text-align:center;margin-top:4px;height:14px}
.penbtn{position:absolute;right:-12px;top:-12px;width:44px;height:44px;border-radius:50%;background:var(--surface);border:2px solid #1F2A44;display:flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer}
.vt-ill img{width:100%;height:100%;object-fit:cover}
.illo.sm{width:74px;height:62px;border-width:2px;border-radius:12px}
.illo.lg{width:200px;height:164px;border-radius:28px}
@media print{.tabs,header.top,.noprint,#sheet,#toast,body::before{display:none!important}body{background:#fff;color:#000}.wrap{padding:0;max-width:none}.card,.list{border:1px solid #bbb}}
.gh{display:flex;align-items:center;gap:16px}
.vgrid,.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.vtile{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;font-family:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px;min-height:170px;cursor:pointer}
.vtile:active,.stile:active{background:var(--brand-soft)}
.vtile.add{justify-content:center;background:transparent;border:2px dashed #B6C4CF}
.vt-ill{width:100%;height:84px;border:3px solid #1F2A44;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.vt-ill svg{width:100%;height:100%}
.vt-name{font-size:17px;font-weight:800;line-height:1.15;letter-spacing:-.2px}
.stile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;font-family:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;min-height:132px;cursor:pointer}
.st-ico{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#1F2A44}
.st-t{font-size:16px;font-weight:800;line-height:1.15}
.st-s{font-size:13px;color:var(--muted)}
.vtile:focus-visible,.stile:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.opt{display:flex;align-items:center;gap:12px;min-height:56px;border:1px solid var(--line);border-radius:14px;padding:0 14px;margin-top:10px;font-weight:700;cursor:pointer;background:var(--bg)}
.opt input{width:22px;height:22px}
.opt:has(input:checked){border-color:var(--link);background:var(--brand-soft)}
.licgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.licslot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:110px;border:2px dashed #B6C4CF;border-radius:12px;background:var(--bg);font-family:inherit;color:var(--ink);font-weight:700;font-size:14px;cursor:pointer;padding:8px}
.licslot.full{border:1px solid var(--line);justify-content:flex-start}
.licslot img{width:100%;aspect-ratio:1.586;object-fit:cover;border-radius:8px}
.rowbtn{width:100%;background:none;border:0;border-top:1px solid var(--line);font-family:inherit;color:inherit;text-align:left;cursor:pointer}
.rowbtn:first-child{border-top:none}
.bt{display:flex;flex-direction:column;gap:4px;min-width:0}
.bt-t{font-size:22px;font-weight:800;letter-spacing:-.3px;line-height:1.15}
.bt-s{font-size:14px;color:var(--muted)}
.alertcard{width:100%;display:flex;align-items:center;gap:12px;text-align:left;font-family:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:12px;cursor:pointer;min-height:64px}
/* ---- stile: carta calda ---- */
body{font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:500;background:var(--bg);background-image:none;color:var(--ink)}
body::before{background:var(--bg)}
h1,h2,.brand-name,.bt-t,.vt-name,.st-t,.vname,.hero .big,.cd b{font-family:"Fraunces",Georgia,"Times New Roman",serif;font-weight:600!important;letter-spacing:-.2px!important}
h1{font-size:32px;line-height:1.1}
h2{font-size:22px}
.brand-name{font-size:24px}
.bt-t{font-size:25px;line-height:1.1}
.vt-name{font-size:19px;line-height:1.1}
.st-t{font-size:18px;line-height:1.1}
.vname{font-size:25px!important;line-height:1.1}
.hero .big{font-size:40px}
.cd b{font-size:27px}
.hand{font-family:"Caveat","Bradley Hand","Segoe Print",cursive;font-size:24px;color:var(--link);font-weight:600;line-height:1.1}
.mark{background:var(--t-moto);color:var(--ink);border:none;border-radius:50%;box-shadow:none}
.homehead{display:flex;align-items:center;gap:14px;padding-top:6px}
.homeav{width:58px;height:58px;border-radius:50%;border:4px solid #CBD8C4;background:var(--t-casa);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0;cursor:pointer;color:var(--link);flex:none}
.homeav img{width:100%;height:100%;object-fit:cover}
.card,.vcard,.list,.hero,.licslot,details.more,.opt{border:1.5px solid var(--line);box-shadow:0 6px 18px var(--shadow)}
.card,.vcard,.list{border-radius:24px}
.hero{border:none;border-radius:26px}
.bigbtn{border:none;box-shadow:0 8px 22px var(--shadow);border-radius:28px;min-height:128px}
.bigbtn[data-vf="auto"]{background:var(--t-auto)}
.bigbtn[data-vf="moto"]{background:var(--t-moto)}
.bigbtn[data-vf="bici"]{background:var(--t-bici)}
.bigbtn[data-tab="casa"]{background:var(--t-casa)}
.bigbtn[data-tab="ass"]{background:var(--t-ass)}
.bigbtn .illo{background:rgba(255,253,249,.55)!important}
.bigbtn:active,.vtile:active,.stile:active{transform:scale(.985);box-shadow:0 3px 10px var(--shadow)}
.vtile,.stile{border:none;box-shadow:0 6px 18px var(--shadow);background:var(--surface);border-radius:24px}
.vtile.add{background:transparent;border:2px dashed var(--line);box-shadow:none}
.illo{border:none;border-radius:22px;box-shadow:none}
.illo.sm{border-radius:16px;box-shadow:none}
.illo.lg{border-radius:34px}
.vt-ill{border:none;border-radius:18px}
.st-ico{color:#5A3E2B}
.btn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:0 2px 6px var(--shadow);border-radius:16px;font-weight:800}
.btn:active{transform:scale(.97);box-shadow:none}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);box-shadow:0 6px 14px rgba(184,92,62,.28)}
.btn[data-act="done"],.btn[data-act="renew-policy"]{background:var(--ok-btn);color:var(--ok-btn-ink);border-color:var(--ok-btn);box-shadow:0 6px 14px rgba(70,100,65,.25)}
.btn.danger{color:var(--danger)}
.btn.icon{border-radius:50%}
.linkbtn,a.linkbtn{text-decoration:none;color:var(--link);font-weight:800}
.chip{border:none}
.cd{border:none;border-radius:20px}
.item,.dl,.rowbtn{border-top:1.5px solid var(--line)}
.item:first-child,.rowbtn:first-child{border-top:none}
.avatar{border:5px solid #CBD8C4;box-shadow:0 6px 18px var(--shadow)}
.penbtn{border:none;box-shadow:0 4px 12px var(--shadow);background:var(--surface);color:var(--ink)}
input[type=text],input[type=date],select,textarea{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;color:var(--ink)}
.opt{border-radius:16px;box-shadow:none}
.opt:has(input:checked){background:var(--brand-soft);border-color:var(--brand)}
details.more{border-radius:16px;box-shadow:none}
.licslot{border:2px dashed var(--line);box-shadow:none;border-radius:16px}
.licslot.full{border:1.5px solid var(--line)}
.tabs{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:496px;margin:0 auto;padding:6px;border:1.5px solid var(--line);border-radius:28px;background:var(--surface);box-shadow:0 10px 28px var(--shadow)}
.tab{border:none;border-radius:22px;color:var(--muted)}
.tab[aria-current="page"]{background:var(--brand-soft);color:var(--link);box-shadow:none}
.panel{border-radius:30px 30px 0 0;border:none;box-shadow:0 -10px 30px rgba(0,0,0,.18)}
.toast{border:none;bottom:calc(98px + env(safe-area-inset-bottom,0px));border-radius:18px;background:var(--ink);color:var(--bg)}
.bar-row .track{background:var(--brand-soft);border:none;height:12px;border-radius:8px}
.bar-row .fill{background:var(--brand);border:none;border-radius:8px}
.mbar{background:var(--brand);border:none;border-radius:8px 8px 3px 3px}
.banner{border:none}
.toast .linkbtn{color:inherit;text-decoration:underline;text-underline-offset:3px}
html{background:var(--bg-bot);min-height:100%}
body{background:transparent;background-image:none}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-mid) 42%,var(--bg-bot) 100%)}
body::before{background:var(--bg-top)}
.swrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.sw{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw.on{border:3px solid var(--ink);box-shadow:0 0 0 3px var(--brand-soft)}
.sw:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.kmchips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:8px}

var today=function(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());};
var daysTo=function(s){var d=parse(s);return d?Math.round((d-today())/86400000):null;};
function addMonths(s,n){
  var d=parse(s)||today();var day=d.getDate();
  var r=new Date(d.getFullYear(),d.getMonth()+n,1);
  var last=new Date(r.getFullYear(),r.getMonth()+1,0).getDate();
  r.setDate(Math.min(day,last));return iso(r);
}
var fmtDate=function(s){var d=parse(s);return d?d.toLocaleDateString("it-IT",{day:"numeric",month:"long",year:"numeric"}):"";};
var fmtShort=function(s){var d=parse(s);return d?d.toLocaleDateString("it-IT",{day:"numeric",month:"short",year:"numeric"}):"";};
var eur=function(n){return new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR"}).format(n||0);};
var cap=function(s){return s.charAt(0).toUpperCase()+s.slice(1);};
var val=function(id){var e=document.getElementById(id);return e?e.value:"";};

function status(d){
  if(d<0)return{c:"late",t:"Scaduta"};
  if(d<=30)return{c:"warn",t:"Scade presto"};
  if(d<=90)return{c:"soon",t:"In arrivo"};
  return{c:"ok",t:"Tutto ok"};
}
function rel(d){
  if(d<0)return d===-1?"scaduta ieri":"scaduta da "+(-d)+" giorni";
  if(d===0)return "scade oggi";
  if(d===1)return "scade domani";
  if(d<=60)return "tra "+d+" giorni";
  return "tra circa "+Math.round(d/30.4)+" mesi";
}

function cdBlock(n){
  var st=status(n),big,small='';
  if(n<0){big='!';small='scaduta';}

  else{big=String(Math.round(n/30.4));small='mesi';}
  return '<div class="cd '+st.c+'"><b>'+big+'</b>'+(small?'<span>'+small+'</span>':'')+'</div>';
}

function dlRow(d){
  var n=daysTo(d.date),v=vOf(d.vehicleId);
  var kn=v?kmNow(v):0;var kl=(d.kmDue&&kn)?d.kmDue-kn:null;
  var block;
  if(kl!==null&&RANK[kmStatus(kl).c]>RANK[status(n).c]){
    var ks=kmStatus(kl);
    block='<div class="cd '+ks.c+'"><b>'+(kl<=0?'!':fmtKm(kl))+'</b><span>'+(kl<=0?'km superati':'km')+'</span></div>';
  }else block=cdBlock(n);
  var kmLine='';
  if(d.kmDue){
    kmLine='<div style="font-size:13px;color:var(--muted)">'+(kn?((kl<=0?'Superati i ':'Oppure a ')+fmtKm(d.kmDue)+' km'+(kl>0?' · mancano '+fmtKm(kl)+' km':'')):('Oppure a '+fmtKm(d.kmDue)+' km · aggiorna i km attuali'))+'</div>';
  }
  var wl=WSKINDS.indexOf(d.kind)>=0?waLink(d):'';
  return '<div class="dl">'+block+'<div style="flex:1;min-width:0"><div style="font-weight:800;font-size:16px">'+esc(LOGKINDS[d.kind].label)+'</div><div style="font-size:13px;color:var(--muted)">'+(n<0?'Scaduta il ':'Scade il ')+esc(fmtDate(d.date))+'</div>'+kmLine+(d.note?'<div style="font-size:13px;color:var(--muted)">'+esc(d.note)+'</div>':'')+'<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="linkbtn" data-act="edit-deadline" data-id="'+d.id+'">Modifica</button>'+(wl?'<a class="linkbtn" href="'+wl+'" target="_blank" rel="noopener">Prenota in officina</a>':'')+'<a class="linkbtn" href="'+calLink(LOGKINDS[d.kind].label+(v?' · '+v.name:''),d.date,'Promemoria da Monitor'+(d.note?': '+d.note:''))+'" target="_blank" rel="noopener">Aggiungi al calendario</a></div></div><button class="btn primary" data-act="done" data-id="'+d.id+'" style="min-height:52px">'+ic('check')+'Fatto</button></div>';

function handleVehPhoto(f,vid){
  var v=vOf(vid);if(!f||!v)return;
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var W=640,H=480,c=document.createElement('canvas');c.width=W;c.height=H;
      var sc=Math.max(W/img.width,H/img.height),w=img.width*sc,h=img.height*sc;
      c.getContext('2d').drawImage(img,(W-w)/2,(H-h)/2,w,h);
      var old=v.photo;v.photo=c.toDataURL('image/jpeg',0.75);
      if(!trySave()){v.photo=old;closeSheet();render();showToast('Spazio esaurito: elimina qualche foto e riprova.');return;}
      closeSheet();render();showToast('Foto salvata');
    };
    img.onerror=function(){showToast('Non riesco a leggere questa foto.');};
    img.src=fr.result;
  };
  fr.readAsDataURL(f);
}

function handlePhoto(f){
  if(!f)return;
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var s=256,c=document.createElement('canvas');c.width=s;c.height=s;
      var m=Math.min(img.width,img.height),sx=(img.width-m)/2,sy=(img.height-m)/2;
      c.getContext('2d').drawImage(img,sx,sy,m,m,0,0,s,s);
      S.profile=S.profile||{name:'',photo:''};
      S.profile.photo=c.toDataURL('image/jpeg',0.85);
      ui.perr='';save();render();
    };
    img.onerror=function(){ui.perr='Non riesco a leggere questa foto. Prova con un’altra.';render();};
    img.src=fr.result;
  };
  fr.onerror=function(){ui.perr='Non riesco a leggere questa foto. Prova con un’altra.';render();};
  fr.readAsDataURL(f);
}

function handleLic(f,side){
  if(!f)return;
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var mx=1200,sc=Math.min(1,mx/Math.max(img.width,img.height));
      var c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      S.profile=S.profile||{name:'',photo:''};S.profile.licenza=S.profile.licenza||{};
      var old=S.profile.licenza[side];S.profile.licenza[side]=c.toDataURL('image/jpeg',0.7);
      if(!trySave()){S.profile.licenza[side]=old;ui.lerr='Spazio esaurito: elimina qualche documento e riprova.';}else ui.lerr='';
      closeSheet();render();
    };
    img.onerror=function(){ui.lerr='Non riesco a leggere questa foto. Prova con un’altra.';render();};
    img.src=fr.result;
  };
  fr.readAsDataURL(f);
}

/* ---- chilometri e documenti ---- */
/* ---- chilometri stimati: l'utente non deve aggiornarli ---- */
function kmNow(v){
  if(!v||!v.km)return 0;
  if(v.kmYear&&v.kmAt){var d0=parse(v.kmAt);if(d0){var days=Math.max(0,Math.round((today()-d0)/86400000));return v.km+Math.round(days/365*v.kmYear);}}
  return v.km;
}
function kmLabel(v){
  if(!v.km)return 'Aggiungi i km attuali';
  var est=!!(v.kmYear&&v.kmAt);
  return (est?'Circa ':'Km attuali: ')+fmtKm(kmNow(v))+(est?' km':'')+' · Aggiorna';
}
function estDate(v,kmLeft){
  var y=(v&&v.kmYear)||12000;var days=Math.max(0,Math.round(kmLeft/y*365));
  var d=new Date(today());d.setDate(d.getDate()+days);return iso(d);
}
function nextByKm(v,every,baseKm){
  var left=baseKm?(baseKm+every-kmNow(v)):every;
  var byKm=(v&&v.kmYear)?estDate(v,left):addMonths(iso(today()),12);
  var cap=addMonths(iso(today()),24);
  return byKm<cap?byKm:cap;
}
function recalcNext(){
  var d=S.deadlines.find(function(x){return x.id===ui.doneId;});if(!d||!$('#x-next'))return;
  var v=vOf(d.vehicleId),every=Math.round(num(val('x-every')))||0;if(!every||!v)return;
  var kmv=Math.round(num(val('x-km')))||0;
  var tmp=kmv?Object.assign({},v,{km:kmv,kmAt:iso(today())}):v;
  $('#x-next').value=nextByKm(tmp,every,kmv||kmNow(v)||0);
}

/* ---- procedura guidata dopo l'aggiunta di un veicolo ---- */
function wzSt(n){return ((ui.wz||{})[n])||{};}
function wzCap(step){
  ui.wz=ui.wz||{};
  var q=function(sel){var e=document.querySelector(sel);return e?e.value:undefined;};
  if(step===1)ui.wz[1]={km:val('w-km'),year:q('input[name=wy]:checked')};
  else if(step===2)ui.wz[2]={mode:q('input[name=wt]:checked'),every:val('w-every'),last:val('w-last')};
  else if(step===3)ui.wz[3]={rev:val('s-revisione'),bol:val('s-bollo')};
  else if(step===4)ui.wz[4]={date:val('s-assicurazione'),mode:q('input[name=im]:checked'),amt:val('im-amt')};
}
function wizHead(n,v){return '<div style="font-size:13px;font-weight:800;color:var(--link);margin-top:4px">Passo '+n+' di 4</div><p style="margin:4px 0 0;font-weight:800">'+esc(v.name)+'</p>';}
function wizKmChips(target,sel){
  return '<div class="kmchips">'+[15000,20000,25000,30000].map(function(k){return '<button type="button" class="kmchip'+(sel===k?' on':'')+'" data-act="pick-every" data-val="'+k+'" data-target="'+target+'">'+fmtKm(k)+' km</button>';}).join('')+'</div><input type="hidden" id="'+target+'" value="'+(sel||'')+'">';
}
function wizBtns(vid,step,last){
  return '<button class="btn" data-act="wiz-back" data-id="'+vid+'" data-step="'+step+'">Indietro</button><button class="btn" data-act="wiz-next" data-id="'+vid+'" data-step="'+step+'" data-skip="1">Salta</button><button class="btn primary" data-act="wiz-next" data-id="'+vid+'" data-step="'+step+'">'+(last?'Fine':'Avanti')+'</button>';
}
function wizKm(vid){
  var v=vOf(vid);if(!v)return;var st=wzSt(1);
  var km=st.km!==undefined?st.km:(v.km||''),y=+(st.year||v.kmYear||12000);
  openSheet('Quanti km ha?',wizHead(1,v)+
    '<label for="w-km">Chilometri adesso</label><input type="text" inputmode="numeric" id="w-km" placeholder="Per esempio: 62000" value="'+esc(km)+'" autocomplete="off"><div class="hint">Lo trovi sul contachilometri.</div>'+
    '<label>Quanti km fai più o meno in un anno?</label>'+
    [[8000,'Pochi','circa 8.000 km'],[12000,'Normali','circa 12.000 km'],[20000,'Tanti','circa 20.000 km']].map(function(o){return '<label class="opt"><input type="radio" name="wy" value="'+o[0]+'"'+(y===o[0]?' checked':'')+'> '+o[1]+' · '+o[2]+'</label>';}).join('')+
    '<div class="hint">Così ti avviso dei tagliandi anche se non aggiorni mai i km: la stima la faccio io.</div>',wizBtns(vid,1,false));
}
function wizTag(vid){
  var v=vOf(vid);if(!v)return;var st=wzSt(2);var mode=st.mode||'now',every=+(st.every||0);
  openSheet('Tagliando',wizHead(2,v)+
    '<label>Quando hai fatto l’ultimo tagliando?</label>'+
    [['now','L’ho appena fatto'],['past','L’ho fatto un po’ di tempo fa'],['unk','Non lo so']].map(function(o){return '<label class="opt"><input type="radio" name="wt" value="'+o[0]+'"'+(mode===o[0]?' checked':'')+'> '+o[1]+'</label>';}).join('')+
    '<div id="w-pastbox"'+(mode==='past'?'':' hidden')+'><label for="w-last">A quanti km l’hai fatto?</label><input type="text" inputmode="numeric" id="w-last" value="'+esc(st.last||'')+'" autocomplete="off"></div>'+
    '<label style="margin-top:16px">Tra quanti km lo rifai?</label>'+wizKmChips('w-every',every)+'<div class="hint">Lo trovi sul libretto dei tagliandi, oppure te lo dice l’officina. Alla data penso io.</div>',wizBtns(vid,2,false));
}
function wizScad(vid){
  var v=vOf(vid);if(!v)return;var st=wzSt(3);
  openSheet('Revisione e bollo',wizHead(3,v)+
    '<label for="s-revisione">Quando scade la revisione?</label><input type="date" id="s-revisione" value="'+esc(st.rev||'')+'"><div class="hint">Guarda il bollino sul libretto. La prima revisione è di solito dopo 4 anni dall’immatricolazione, poi ogni 2: verifica sul libretto.</div>'+
    '<label for="s-bollo">Quando scade il bollo?</label><input type="date" id="s-bollo" value="'+esc(st.bol||'')+'"><div class="hint">Il mese di scadenza del bollo.</div>',wizBtns(vid,3,false));
}
function wizIns(vid){
  var v=vOf(vid);if(!v)return;var st=wzSt(4);var mode=st.mode||'annuale';
  openSheet('Assicurazione',wizHead(4,v)+
    '<label for="s-assicurazione">Quando scade?</label><input type="date" id="s-assicurazione" value="'+esc(st.date||'')+'"><div class="hint">La data di scadenza della polizza.</div>'+
    '<label>Come la paghi?</label>'+Object.keys(PAYM).map(function(k){return '<label class="opt"><input type="radio" name="im" value="'+k+'"'+(mode===k?' checked':'')+'> '+esc(PAYM[k].label)+'</label>';}).join('')+
    '<label for="im-amt">Quanto paghi ogni volta? (€)</label><input type="text" inputmode="decimal" id="im-amt" placeholder="€" value="'+esc(st.amt||'')+'" autocomplete="off"><div class="hint">Se la paghi ogni mese, scrivi la rata del mese.</div>',wizBtns(vid,4,true));
}
function wizBack(vid,step){
  wzCap(step);
  if(step===1){sheetVehicle(vid);return;}
  [wizKm,wizTag,wizScad][step-2](vid);
}
function wizClean(v,n){
  S.deadlines=S.deadlines.filter(function(d){return !(d.vehicleId===v.id&&d.wz===n);});
  S.log=S.log.filter(function(l){return !(l.vehicleId===v.id&&l.wz===n);});
}
function wizNext(vid,step,skip){
  var v=vOf(vid);if(!v)return;
  if(!skip){
    wzCap(step);
    if(step===1){
      var km=Math.round(num(val('w-km')))||0,r=document.querySelector('input[name=wy]:checked');
      if(r)v.kmYear=+r.value;
      if(km){v.km=km;v.kmAt=iso(today());}else{delete v.km;delete v.kmAt;}
    }else if(step===2){
      wizClean(v,2);
      var mode=(document.querySelector('input[name=wt]:checked')||{}).value,every=Math.round(num(val('w-every')))||0;
      if(mode!=='unk'&&every){
        var lastKm=mode==='now'?(v.km||0):(Math.round(num(val('w-last')))||0);
        var d={id:uid(),vehicleId:v.id,kind:'tagliando',date:nextByKm(v,every,lastKm),note:'',everyKm:every,wz:2};
        if(lastKm)d.kmDue=lastKm+every;
        S.deadlines.push(d);
        if(mode==='now')S.log.push({id:uid(),vehicleId:v.id,date:iso(today()),kind:'tagliando',amount:0,km:v.km||0,note:'',wz:2});
      }
    }else if(step===3){
      wizClean(v,3);
      ['revisione','bollo'].forEach(function(k){var e=document.getElementById('s-'+k);if(e&&e.value)S.deadlines.push({id:uid(),vehicleId:v.id,kind:k,date:e.value,note:'',wz:3});});
    }else if(step===4){
      wizClean(v,4);
      var dt=val('s-assicurazione');if(dt)S.deadlines.push({id:uid(),vehicleId:v.id,kind:'assicurazione',date:dt,note:'',wz:4});
      var rr=document.querySelector('input[name=im]:checked'),am=num(val('im-amt'));
      if(am>0)v.ins={mode:rr?rr.value:'annuale',amount:am};else delete v.ins;
    }
    save();
  }
  if(step<4)[wizKm,wizTag,wizScad,wizIns][step](vid);
  else{closeSheet();ui.tab='veicolo';ui.vid=vid;render();window.scrollTo(0,0);showToast('Tutto pronto');}
}
function sheetKm(vid){
  var v=vOf(vid);if(!v)return;
  openSheet('Chilometri attuali','<p style="margin:8px 0 0;font-weight:700">'+esc(v.name)+'</p><label for="k-km">Quanti chilometri ha adesso?</label><input type="text" inputmode="numeric" id="k-km" value="'+(kmNow(v)||'')+'" autocomplete="off"><div class="hint">Lo trovi sul contachilometri. Se non lo aggiorni, ne faccio io una stima.</div><label>Quanti km fai più o meno in un anno?</label>'+[[8000,'Pochi','circa 8.000 km'],[12000,'Normali','circa 12.000 km'],[20000,'Tanti','circa 20.000 km']].map(function(o){return '<label class="opt"><input type="radio" name="wy" value="'+o[0]+'"'+((v.kmYear||12000)===o[0]?' checked':'')+'> '+o[1]+' · '+o[2]+'</label>';}).join(''),CANCEL+'<button class="btn primary" data-act="save-km" data-id="'+vid+'">Salva</button>');
}
function sheetDocs(vid){
  var v=vOf(vid);if(!v)return;
  var ds=(S.docs||[]).filter(function(x){return x.vehicleId===vid;}).sort(function(a,b){return a.date<b.date?1:-1;});
  var body='<p style="margin:8px 0 0;font-weight:700">'+esc(v.name)+'</p>';
  body+=ds.length?'<div class="docgrid">'+ds.map(function(x){return '<button class="docthumb" data-act="view-doc" data-id="'+x.id+'"><img src="'+x.photo+'" alt="'+esc(DOCK[x.kind]||'Documento')+'"><span>'+esc(DOCK[x.kind]||'Documento')+'</span></button>';}).join('')+'</div>':'<p style="color:var(--muted)">Nessun documento. Fotografa il libretto, la polizza o le fatture: le avrai sempre con te.</p>';
  body+='<label for="doc-kind">Che documento è?</label><select id="doc-kind">'+opts(DOCK,'libretto')+'</select><label class="btn primary block big" for="doc-in" style="margin-top:12px;cursor:pointer">'+ic('plus')+'Fotografa o scegli un documento</label><input class="sr" type="file" id="doc-in" accept="image/*" data-vid="'+vid+'">';
  openSheet('Documenti',body,'<button class="btn" data-act="close">Chiudi</button>');
}
function sheetDoc(id){
  var x=(S.docs||[]).find(function(d){return d.id===id;});if(!x)return;
  openSheet(DOCK[x.kind]||'Documento','<img src="'+x.photo+'" alt="'+esc(DOCK[x.kind]||'Documento')+'" style="width:100%;border-radius:12px;margin-top:12px">','<button class="btn" data-act="docs" data-id="'+x.vehicleId+'">Indietro</button><button class="btn danger" data-act="del-doc" data-id="'+id+'">Elimina</button>');
}
function trySave(){try{localStorage.setItem(KEY,JSON.stringify(S));return true;}catch(e){return false;}}
function handleDoc(f,vid,kind){
  if(!f)return;
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var mx=1100,sc=Math.min(1,mx/Math.max(img.width,img.height));
      var c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      S.docs=S.docs||[];
      var doc={id:uid(),vehicleId:vid,kind:kind,date:iso(today()),photo:c.toDataURL('image/jpeg',0.65)};
      S.docs.push(doc);
      if(!trySave()){S.docs.pop();sheetDocs(vid);err('Spazio esaurito: elimina qualche documento e riprova.');return;}
      render();sheetDocs(vid);
    };
    img.onerror=function(){sheetDocs(vid);err('Non riesco a leggere questa foto. Prova con un’altra.');};
    img.src=fr.result;
  };
  fr.readAsDataURL(f);
}

/* ---- grafico mensile delle spese ---- */
function monthChart(items){
  var keys=[],base=today();
  if(ui.period==='12m'){for(var i=11;i>=0;i--){var d=new Date(base.getFullYear(),base.getMonth()-i,1);keys.push(d.getFullYear()+'-'+pad(d.getMonth()+1));}}
  else{for(var m=1;m<=12;m++)keys.push(ui.period+'-'+pad(m));}
  var sums={};items.forEach(function(l){var k=l.date.slice(0,7);sums[k]=(sums[k]||0)+(l.amount||0);});
  var max=Math.max.apply(null,keys.map(function(k){return sums[k]||0;}))||1;
  var MN=['G','F','M','A','M','G','L','A','S','O','N','D'];
  var MNF=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
  var best=keys.reduce(function(a,k){return (sums[k]||0)>(sums[a]||0)?k:a;},keys[0]);
  var cols=keys.map(function(k){var v=sums[k]||0;return '<div class="mcol" title="'+esc(MNF[parseInt(k.slice(5),10)-1]+': '+eur(v))+'"><div class="mbarwrap"><div class="mbar" style="height:'+(v?Math.max(4,Math.round(v/max*100)):0)+'%"></div></div><div class="mlab">'+MN[parseInt(k.slice(5),10)-1]+'</div></div>';}).join('');
  return '<div class="section-head"><h2>Mese per mese</h2></div><div class="card" style="margin-top:10px"><div class="mchart">'+cols+'</div>'+((sums[best]||0)>0?'<div style="font-size:14px;color:var(--muted);margin-top:10px">Il mese più caro è stato '+MNF[parseInt(best.slice(5),10)-1]+': <b style="color:var(--ink)">'+esc(eur(sums[best]))+'</b></div>':'')+'</div>';
}
function finishOnb(){S.profile=S.profile||{name:'',photo:''};S.profile.onboarded=true;save();ui.tab=ui.onbReplay?'profilo':'home';ui.onbReplay=false;ui.onb=0;}
function render(){
  var nv=document.querySelector('nav.tabs');if(nv)nv.hidden=(ui.tab==='onb');
  var act=ui.tab==='spese'?'spese':ui.tab==='profilo'?'profilo':'home';
  var tabs=[['home','Home','home'],['spese','Spese','chart'],['profilo','Profilo','user']];
  $('#tabs').innerHTML=tabs.map(function(t){
    return '<button class="tab" data-act="nav" data-tab="'+t[0]+'"'+(act===t[0]?' aria-current="page"':'')+'>'+ic(t[2],22)+t[1]+'</button>';
  }).join('');
  var v=ui.tab==='veicolo'?viewVeicolo():ui.tab==='sezione'?viewSezione():ui.tab==='onb'?viewOnb():ui.tab==='storico'?viewStorico():ui.tab==='garage'?viewGarage():ui.tab==='spese'?viewSpese():ui.tab==='casa'?viewCasa():ui.tab==='ass'?viewAss():ui.tab==='profilo'?viewProfilo():viewHome();
  $('#app').innerHTML=(ui.tab==='home'?'':'<header class="top"><div class="mark">'+ic('okc',22)+'</div><span class="brand-name">Monitor</span></header>')+
    (ui.storageOk?'':'<div class="banner" role="alert">Il salvataggio automatico non è disponibile in questo browser: i dati si perdono alla chiusura. Usa la copia di sicurezza (scheda Profilo).</div>')+v;
}
function viewSpese(){
  var years=[];S.log.forEach(function(l){var y=l.date.slice(0,4);if(years.indexOf(y)<0)years.push(y);});
  years.sort().reverse();
  if(ui.period!=='12m'&&years.indexOf(ui.period)<0)ui.period='12m';
  var start=addMonths(iso(today()),-12);
  var items=S.log.filter(function(l){return ui.period==='12m'?l.date>=start:l.date.slice(0,4)===ui.period;});
  var total=items.reduce(function(a,l){return a+(l.amount||0);},0);
  var h='<h1>Spese</h1>';
  if(!S.vehicles.length)return h+'<div class="card empty"><p>Quando aggiungi un veicolo e registri tagliandi, bolli, assicurazione e gomme, le spese compaiono qui da sole.</p></div>';
  h+='<label for="period" style="margin-top:8px">Periodo</label><select id="period"><option value="12m"'+(ui.period==='12m'?' selected':'')+'>Ultimi 12 mesi</option>'+years.map(function(y){return '<option value="'+y+'"'+(ui.period===y?' selected':'')+'>Anno '+y+'</option>';}).join('')+'</select>';
  h+='<div class="hero"><span class="meta">Totale</span><div class="big">'+esc(eur(total))+'</div>'+(ui.period==='12m'?'<div class="meta">circa '+esc(eur(total/12))+' al mese</div>':'')+'</div>';
  h+='<button class="btn primary block big" style="margin-top:14px" data-act="extra-start">'+ic('plus')+'Aggiungi una spesa extra</button>';
  if(!items.length){
    h+='<div class="card empty"><p>Nessuna spesa in questo periodo. Le spese arrivano da sole dalle schede dei tuoi veicoli: tagliandi, bolli, assicurazione, revisioni, gomme e altre spese.</p></div>';
    return h;
  }
  h+=monthChart(items);
  var byK={},byV={};
  items.forEach(function(l){var s=secOfKind(l.kind);byK[s]=(byK[s]||0)+(l.amount||0);byV[l.vehicleId]=(byV[l.vehicleId]||0)+(l.amount||0);});
  var bars=function(obj,nameFn){
    var arr=Object.keys(obj).map(function(k){return[k,obj[k]];}).sort(function(a,b){return b[1]-a[1];});
    var max=arr[0][1]||1;
    return arr.map(function(a){return '<div class="bar-row"><div class="name">'+esc(nameFn(a[0]))+'</div><div class="track"><div class="fill" style="width:'+Math.max(3,Math.round(a[1]/max*100))+'%"></div></div><div class="amt">'+esc(eur(a[1]))+'</div></div>';}).join('');
  };
  h+='<div class="section-head"><h2>Per voce</h2></div><div class="card" style="margin-top:10px">'+bars(byK,function(k){return SEC[k]?SEC[k].title:k;})+'</div>';
  if(S.vehicles.length>1)h+='<div class="section-head"><h2>Per veicolo</h2></div><div class="card" style="margin-top:10px">'+bars(byV,vName)+'</div>';
  h+='<div class="section-head"><h2>Tutte le spese</h2></div><div class="list">'+items.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0;}).map(function(l){
    var sub=[vName(l.vehicleId),fmtShort(l.date)];if(l.km)sub.push(fmtKm(l.km)+' km');
    return '<button class="item rowbtn" data-act="open-sec" data-id="'+l.vehicleId+'" data-sec="'+secOfKind(l.kind)+'"><div class="ico">'+ic(kindIcon(l.kind))+'</div><div class="grow"><div class="t">'+esc(l.title||(LOGKINDS[l.kind]||{label:l.kind}).label)+'</div><div class="s">'+esc(sub.join(' · '))+'</div></div><div style="font-weight:800">'+esc(eur(l.amount))+'</div></button>';
  }).join('')+'</div>';
  h+='<p class="note">Le spese arrivano da sole dalle schede dei veicoli, oppure le aggiungi da qui con “Aggiungi una spesa extra”. Tocca una voce per aprirla.</p>';
  return h;
}

/* ---------- finestre ---------- */
function openSheet(title,body,foot){
  var s=$("#sheet");
  s.innerHTML="<div class=\"scrim\" data-act=\"close\"></div><div class=\"panel\" role=\"dialog\" aria-modal=\"true\" aria-label=\""+esc(title)+"\"><div class=\"phead\"><div class=\"grab\"></div><div class=\"prow\"><h2>"+esc(title)+"</h2><button class=\"xbtn\" data-act=\"close\" aria-label=\"Chiudi\">✕</button></div></div>"+body+"<div class=\"err\" id=\"err\" role=\"alert\"></div><div class=\"actions\">"+foot+"</div></div>";
  s.classList.add("open");
}
function closeSheet(){var s=$("#sheet");s.classList.remove("open");s.innerHTML="";ui.wiz=null;ui.wz=null;}
function err(m){var e=$("#err");if(e)e.textContent=m;}
function opts(map,sel){return Object.keys(map).map(function(k){var l=typeof map[k]==="string"?map[k]:map[k].label;return "<option value=\""+k+"\""+(k===sel?" selected":"")+">"+esc(l)+"</option>";}).join("");}
function vehOpts(sel){return S.vehicles.map(function(v){return "<option value=\""+v.id+"\""+(v.id===sel?" selected":"")+">"+esc(v.name)+"</option>";}).join("");}
function kindOpts(v,sel){return kindsFor(v).map(function(k){return "<option value=\""+k+"\""+(k===sel?" selected":"")+">"+esc(KINDS[k].label)+"</option>";}).join("");}
var CANCEL="<button class=\"btn\" data-act=\"close\">Annulla</button>";

    '<label for="v-fuel">Alimentazione</label><select id="v-fuel">'+opts(FUELS,v.fuel||'benzina')+'</select></div>'+
    '<div class="bic" hidden><label for="v-bname">Come si chiama la bici?</label><input type="text" id="v-bname" value="'+esc(v.type==='bici'?v.name:'')+'" placeholder="Per esempio: Bici da corsa" autocomplete="off"></div>'+

function num(s){var n=parseFloat(String(s||"").replace(",","."));return isFinite(n)&&n>0?n:0;}
function saveDone(id){
  var d=S.deadlines.find(function(x){return x.id===id;});if(!d)return false;

  var v=vOf(d.vehicleId);
  var kmv=Math.round(num(val('x-km')))||0,every=Math.round(num(val('x-every')))||0;
  S.log.push({id:uid(),vehicleId:d.vehicleId,date:date,kind:d.kind,amount:num(val('x-amt')),km:kmv,note:d.note||''});
  if(kmv&&v){v.km=kmv;v.kmAt=iso(today());}
  if(every)d.everyKm=every;
  var baseKm=kmv||(v&&kmNow(v))||0;
  if(KMKINDS.indexOf(d.kind)>=0&&d.everyKm&&baseKm)d.kmDue=baseKm+d.everyKm;else delete d.kmDue;
  var nx=val('x-next');

}

    case 'lock-reset':enableLock();break;
    case 'lock-off':requireUnlock(function(){S.profile.lock=null;ui.unlockUntil=0;save();render();showToast('Blocco disattivato');});break;
    case 'del-lic':withUndo('Foto eliminata',function(){var sd=el.getAttribute('data-side');S.profile.licenza[sd]='';save();closeSheet();render();});break;
    case 'edit-licexp':sheetLicExp();break;
    case 'save-licexp':S.profile=S.profile||{name:'',photo:''};S.profile.licenza=S.profile.licenza||{};S.profile.licenza.expiry=val('le-date');save();closeSheet();render();break;
    case 'edit-ins':sheetIns(id);break;
    case 'save-ins':saveIns(id);break;
    case 'install':if(deferredInstall){deferredInstall.prompt();deferredInstall.userChoice.then(function(){deferredInstall=null;render();});}break;
    case 'veh-color':var cv2=el.getAttribute('data-color'),vv2=vOf(id);if(vv2){vv2.color=cv2;save();render();document.querySelectorAll('.sw[data-act="veh-color"]').forEach(function(b){var on=b.getAttribute('data-color')===cv2;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);});}break;
    case 'veh-photo':sheetVehPhoto(id);break;
    case 'veh-photo-del':withUndo('Foto rimossa',function(){var vv=vOf(id);if(vv)vv.photo='';save();closeSheet();render();});break;
    case 'open-veh':ui.tab='veicolo';ui.vid=id;render();window.scrollTo(0,0);break;
    case 'open-sec':ui.tab='sezione';ui.vid=id;ui.sec=el.getAttribute('data-sec');render();window.scrollTo(0,0);break;
    case 'new-dl':sheetNewDeadline(id,el.getAttribute('data-kind'));break;
    case 'past':if(ui.sec==='altro')sheetExtra(id);else sheetPast(id);break;
    case 'extra-start':sheetExtraVeh();break;
    case 'extra-veh':sheetExtra(id);break;
    case 'extra-back':sheetExtra(id);break;
    case 'extra-pick':var xv=vOf(id),xi=+el.getAttribute('data-i');sheetExtraForm(id,xi>=0&&xv?extrasFor(xv)[xi]:'');break;
    case 'extra-save':saveExtra(id,el.getAttribute('data-title')||'');break;
    case 'save-past':savePast(id,el.getAttribute('data-kind'));break;
    case 'edit-km':sheetKm(id);break;
    case 'save-km':var vk=vOf(id);if(vk){vk.km=Math.round(num(val('k-km')))||0;vk.kmAt=iso(today());var ry=document.querySelector('input[name=wy]:checked');if(ry)vk.kmYear=+ry.value;save();closeSheet();render();}break;
    case 'docs':requireUnlock(function(){sheetDocs(id);});break;
    case 'view-doc':sheetDoc(id);break;
    case 'del-doc':withUndo('Documento eliminato',function(){S.docs=(S.docs||[]).filter(function(x){return x.id!==id;});save();closeSheet();render();});break;
    case 'storico':ui.tab='storico';ui.vid=id;render();window.scrollTo(0,0);break;
    case 'print':try{window.print();}catch(x){showToast('Non riesco ad aprire la stampa da qui. Usa “Copia come testo”.');}break;
    case 'copy-storico':var sv=vOf(ui.vid);if(sv){try{navigator.clipboard.writeText(storicoText(sv)).then(function(){showToast('Copiato');},function(){showToast('Non riesco a copiare da qui.');});}catch(x){showToast('Non riesco a copiare da qui.');}}break;
    case 'undo':if(undoSnap){S=JSON.parse(undoSnap);undoSnap=null;save();$('#toast').hidden=true;render();}break;
    case 'onb-prev':ui.onb=Math.max(0,(ui.onb||0)-1);render();break;
    case 'onb-replay':ui.onbReplay=true;ui.onb=0;ui.tab='onb';render();window.scrollTo(0,0);break;
    case 'onb-next':ui.onb=(ui.onb||0)+1;render();break;
    case 'onb-skip':finishOnb();render();break;
    case 'onb-start':finishOnb();ui.tab='garage';ui.vf='auto';render();sheetVehicle();break;
    case 'export':sheetExport();break;
    case 'copy-export':
      var ta=$('#bk');ta.select();
      try{navigator.clipboard.writeText(ta.value).then(function(){err('Copiato.');},function(){err('Seleziona il testo e copialo a mano.');});}catch(x){err('Seleziona il testo e copialo a mano.');}
      break;
    case 'import':sheetImport();break;
    case 'do-import':doImport();break;
    case 'reset':sheetConfirm('Cancellare tutti i veicoli, le scadenze, le polizze e lo storico?','do-reset');break;
    case 'del-photo':S.profile=S.profile||{name:'',photo:''};S.profile.photo='';ui.perr='';save();render();break;
    case 'do-reset':S={vehicles:[],deadlines:[],log:[],policies:[],profile:{name:'',photo:''},docs:[]};save();closeSheet();ui.tab='home';render();break;
  }
});
document.addEventListener('change',function(e){
  var id=e.target.id;
  if(id==='photo-in'){handlePhoto(e.target.files&&e.target.files[0]);e.target.value='';return;}
  if(e.target.name==='wt'){var pb=$('#w-pastbox');if(pb)pb.hidden=(e.target.value!=='past');return;}
  if(id==='x-km'){recalcNext();return;}
  if(id==='vp-cam'||id==='vp-lib'){handleVehPhoto(e.target.files&&e.target.files[0],ui.vid);e.target.value='';return;}
  if(id==='lic-front'||id==='lic-back'){handleLic(e.target.files&&e.target.files[0],id==='lic-front'?'front':'back');e.target.value='';return;}
  if(id==='doc-in'){handleDoc(e.target.files&&e.target.files[0],e.target.getAttribute('data-vid'),val('doc-kind'));e.target.value='';return;}
  if(id==='period'){ui.period=e.target.value;render();}
  else if(id==='v-type'){var b=$('#v-brand');if(b)b.innerHTML=brandOpts(e.target.value,'');applyType();refreshModels('');}
  else if(id==='v-brand')refreshModels('');
  else if(id==='v-msel'){var mm=carModels().filter(function(x){return x[0]===e.target.value;})[0];if(mm&&mm[1]&&$('#v-fuel'))$('#v-fuel').value=mm[1];refreshModels(e.target.value);}
  else if(id==='d-veh'){$('#d-kind').innerHTML=kindOpts(vOf(e.target.value),'');}
});
(function(){
  var sh=document.getElementById('sheet'),y0=null,dy=0,pan=null,drag=false;
  sh.addEventListener('touchstart',function(e){pan=sh.querySelector('.panel');if(!pan||!pan.contains(e.target)){y0=null;return;}y0=e.touches[0].clientY;dy=0;drag=false;},{passive:true});
  sh.addEventListener('touchmove',function(e){
    if(y0===null||!pan)return;
    var d=e.touches[0].clientY-y0;
    if(!drag){
      var onHead=!!e.target.closest('.phead');
      if(d>8&&(onHead||pan.scrollTop<=0))drag=true;else return;
    }
    dy=Math.max(0,d);pan.style.transition='none';pan.style.transform='translateY('+dy+'px)';
    if(e.cancelable)e.preventDefault();
  },{passive:false});
  sh.addEventListener('touchend',function(){
    if(y0===null||!pan)return;
    if(drag){pan.style.transition='transform .2s';if(dy>110){pan.style.transform='translateY(100%)';setTimeout(closeSheet,180);}else{pan.style.transform='';}}
    y0=null;drag=false;
  });
})();
if(!S.vehicles.length&&!(S.profile&&S.profile.onboarded)){ui.tab='onb';ui.onb=0;}
render();
})();
</script>

if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
